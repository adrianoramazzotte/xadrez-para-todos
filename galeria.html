<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria — Xadrez para Todos | Associação Soberano Rei</title>
<meta name="description" content="Registros fotográficos das competições da Associação Soberano Rei — Xadrez Arapongas.">
<meta name="theme-color" content="#12100e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 48'%3E%3Crect width='40' height='48' fill='%23c8952b'/%3E%3Ccircle cx='20' cy='10' r='7.6' fill='%2312100e'/%3E%3Cpath d='M12.9 18h14.2l-1.7 4.3H14.6z' fill='%2312100e'/%3E%3Cpath d='M14.4 24h11.2c.2 7.4 2 11.7 4.6 14.5H9.8c2.6-2.8 4.4-7.1 4.6-14.5z' fill='%2312100e'/%3E%3Crect x='5.8' y='38.6' width='28.4' height='6.5' rx='3.2' fill='%2312100e'/%3E%3C/svg%3E">
<style>
:root{--ink:#12100e;--ink-2:#1c1916;--cream:#f6f1e7;--gold:#c8952b;--gold-soft:#e8bf65;
  --line-dark:rgba(246,241,231,.14);--muted-dark:#a79f95;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.12;letter-spacing:-.015em;margin:0;font-size:clamp(30px,5vw,46px)}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:20;background:rgba(18,16,14,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-dark)}
.nav{display:flex;align-items:center;gap:16px;height:66px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:600;font-size:15px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex:0 0 auto}
.mark svg{width:18px;display:block}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted-dark)}
.back{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;
  border:1px solid var(--line-dark);text-decoration:none;font-size:14.5px;font-weight:600;white-space:nowrap}
.back:hover{background:rgba(246,241,231,.07)}

.head{padding:64px 0 34px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 16px}
.sub{margin:18px 0 0;color:var(--muted-dark);font-size:17px;max-width:64ch}
.tabs{display:flex;flex-wrap:wrap;gap:9px;margin:34px 0 0}
.tab{padding:9px 18px;border-radius:999px;border:1px solid var(--line-dark);text-decoration:none;font-size:14.5px;font-weight:500;color:var(--muted-dark)}
.tab:hover{color:var(--cream);background:rgba(246,241,231,.06)}
.tab[aria-current="page"]{background:var(--gold);border-color:var(--gold);color:#1a1509;font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:14px 0 90px}
.shot{position:relative;aspect-ratio:4/3;border:0;padding:0;border-radius:var(--r);overflow:hidden;cursor:zoom-in;
  background:var(--ink-2);display:block;width:100%}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.shot:hover img{transform:scale(1.05)}
.shot:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.empty{border:1px dashed var(--line-dark);border-radius:var(--r);padding:56px 30px;text-align:center;margin:14px 0 90px;
  background:linear-gradient(155deg,#241f1a,#17140f)}
.empty svg{width:52px;color:var(--gold);opacity:.85;margin-bottom:18px}
.empty h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:23px;margin:0 0 10px}
.empty p{margin:0 auto;color:var(--muted-dark);max-width:46ch;font-size:15.5px}

dialog#lb{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;width:100%;height:100%}
dialog#lb::backdrop{background:rgba(10,9,8,.94)}
.lb-in{position:fixed;inset:0;display:grid;place-items:center;padding:56px 16px}
.lb-in img{max-width:min(1200px,94vw);max-height:84vh;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.lb-btn{position:fixed;background:rgba(246,241,231,.1);border:1px solid var(--line-dark);color:var(--cream);
  width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer;display:grid;place-items:center;line-height:1}
.lb-btn:hover{background:var(--gold);color:#1a1509;border-color:var(--gold)}
#lbPrev{left:16px;top:50%;transform:translateY(-50%)}
#lbNext{right:16px;top:50%;transform:translateY(-50%)}
#lbClose{right:16px;top:16px}
.lb-count{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:14px;color:var(--muted-dark)}

footer{border-top:1px solid var(--line-dark);padding:34px 0;color:var(--muted-dark);font-size:13.5px}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="index.html">
      <span class="mark"><svg viewBox="0 0 40 48" aria-hidden="true" fill="currentColor"><circle cx="20" cy="10" r="7.6"/><path d="M12.9 18h14.2l-1.7 4.3H14.6z"/><path d="M14.4 24h11.2c.2 7.4 2 11.7 4.6 14.5H9.8c2.6-2.8 4.4-7.1 4.6-14.5z"/><rect x="5.8" y="38.6" width="28.4" height="6.5" rx="3.2"/></svg></span>
      <span>Xadrez para Todos<small>Associação Soberano Rei · Arapongas</small></span>
    </a>
    <a class="back" href="index.html">&#8592; Voltar ao projeto</a>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <p class="eyebrow">Galeria de competições</p>
    <h1 id="titulo">Carregando…</h1>
    <p class="sub" id="descricao"></p>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <div id="conteudo"></div>
</main>

<dialog id="lb">
  <div class="lb-in">
    <img id="lbImg" alt="">
    <button class="lb-btn" id="lbPrev" aria-label="Foto anterior">&#8249;</button>
    <button class="lb-btn" id="lbNext" aria-label="Próxima foto">&#8250;</button>
    <button class="lb-btn" id="lbClose" aria-label="Fechar">&#10005;</button>
    <span class="lb-count" id="lbCount"></span>
  </div>
</dialog>

<footer>
  <div class="wrap">
    Associação Soberano Rei — Xadrez Arapongas · CNPJ 52.542.855/0001-48 ·
    Projeto <b style="color:var(--cream)">Xadrez para Todos</b> · Proesporte PR · Edital nº 06/2025 · Código 91327
  </div>
</footer>

<script>
const CATS = {
  mundial:      {nome:"Mundiais",        desc:"Campeonato Mundial Escolar (ISF U15 Gymnasiade), Zlatibor — Sérvia, 2025, e Mundial de Cadetes da FIDE."},
  pan:          {nome:"Pan-Americanos",  desc:"Festival Pan-Americano da Juventude e Campeonato Continental das Américas."},
  sulamericano: {nome:"Sul-Americanos",  desc:"Festival Sul-Americano de Xadrez da Juventude."},
  olimpiadas:   {nome:"Olimpíadas",      desc:"Registros da participação da equipe em olimpíadas de xadrez."},
  brasileiros:  {nome:"Brasileiros",     desc:"Festival Nacional da Criança e da Juventude e demais campeonatos brasileiros."}
};
const ORDEM = ["mundial","pan","sulamericano","olimpiadas","brasileiros"];

const params = new URLSearchParams(location.search);
let cat = params.get("c");
if (!CATS[cat]) cat = "mundial";

document.getElementById("titulo").textContent = CATS[cat].nome;
document.getElementById("descricao").textContent = CATS[cat].desc;
document.title = CATS[cat].nome + " — Galeria | Xadrez para Todos";

document.getElementById("tabs").innerHTML = ORDEM.map(c =>
  `<a class="tab" href="galeria.html?c=${c}"${c===cat?' aria-current="page"':''}>${CATS[c].nome}</a>`
).join("");

const CAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.4" y="6.2" width="19.2" height="14" rx="2.6"/><circle cx="12" cy="13.2" r="4"/><path d="M8.6 6.2 10 3.6h4l1.4 2.6"/></svg>';

function vazio(msg){
  document.getElementById("conteudo").innerHTML =
    `<div class="empty">${CAMERA}<h2>Fotos em breve</h2><p>${msg}</p></div>`;
}

let fotos = [];
fetch("fotos/fotos.json", {cache:"no-store"})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(dados => {
    fotos = dados[cat] || [];
    if (!fotos.length) return vazio("Ainda não publicamos os registros desta competição. Assim que as imagens forem organizadas, elas aparecem aqui.");
    document.getElementById("conteudo").innerHTML =
      '<div class="grid">' + fotos.map((f,i) =>
        `<button class="shot" data-i="${i}" aria-label="Abrir foto ${i+1} de ${fotos.length}">
           <img src="fotos/${cat}/${encodeURIComponent(f)}" alt="${CATS[cat].nome} — foto ${i+1}" loading="lazy" decoding="async">
         </button>`).join("") + '</div>';
  })
  .catch(() => vazio("Não foi possível carregar a lista de fotos agora. Se você está abrindo o arquivo direto do computador, publique no servidor para ver a galeria."));

const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg"), lbCount = document.getElementById("lbCount");
let idx = 0;
function mostrar(i){
  idx = (i + fotos.length) % fotos.length;
  lbImg.src = `fotos/${cat}/${encodeURIComponent(fotos[idx])}`;
  lbImg.alt = `${CATS[cat].nome} — foto ${idx+1}`;
  lbCount.textContent = `${idx+1} / ${fotos.length}`;
}
document.addEventListener("click", e => {
  const b = e.target.closest(".shot");
  if (b){ mostrar(+b.dataset.i); lb.showModal(); }
});
document.getElementById("lbNext").onclick = () => mostrar(idx+1);
document.getElementById("lbPrev").onclick = () => mostrar(idx-1);
document.getElementById("lbClose").onclick = () => lb.close();
lb.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") mostrar(idx+1);
  if (e.key === "ArrowLeft")  mostrar(idx-1);
});
</script>
</body>
</html>
